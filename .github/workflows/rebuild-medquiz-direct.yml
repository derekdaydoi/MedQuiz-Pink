name: Rebuild MedQuiz direct app

on:
  push:
    paths:
      - .github/workflows/rebuild-medquiz-direct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild standalone index
        shell: bash
        run: |
          set -euo pipefail
          cat final-payload-1.b64 final-payload-2a.b64 final-payload-2b.b64 final-payload-3.b64 final-payload-4.b64 final-payload-5a.b64 final-payload-5b.b64 final-payload-6.b64 > /tmp/medquiz.b64
          base64 -d /tmp/medquiz.b64 | gzip -d > index.html
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'MedQuiz Pink' index.html
          grep -q 'Review Queue' index.html
          grep -q 'parseQuestionText' index.html
          grep -q 'Xác nhận → Question Bank' index.html
          python - <<'PY'
          import re, pathlib, subprocess, tempfile, os
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          js = '\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(js)
              name = f.name
          try:
              subprocess.run(['node', '--check', name], check=True)
          finally:
              os.unlink(name)
          print('Verified direct index:', len(html), 'bytes')
          PY

      - name: Remove obsolete loader artifacts
        shell: bash
        run: |
          rm -f bundle-1.js bundle-2.js bundle-3.js bundle-4.js bundle-5a.js bundle-5b.js bundle-6a.js bundle-6b.js
          rm -f app-direct.gz.b64 payload-1.b64 payload-2.b64 payload-3.b64 payload-4.b64
          rm -f final-payload-2.b64 final-payload-5.b64

      - name: Commit direct production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: deploy MedQuiz Pink final direct build'
          git push
