name: Rebuild MedQuiz direct app

on:
  push:
    paths:
      - .github/workflows/rebuild-medquiz-direct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct app
        shell: bash
        env:
          REBUILD_B64: 
        run: |
          printf '%s' "$REBUILD_B64" | base64 -d | gzip -d > /tmp/rebuild.py
          python /tmp/rebuild.py
      - name: Commit direct index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: serve direct app and make PDF review editable"
          git push origin HEAD:main
