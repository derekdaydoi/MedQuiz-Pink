<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedQuiz Pink</title>
</head>
<body style="margin:0;background:#fff3f8;font-family:Segoe UI,Arial,sans-serif">
<div id="loading" style="min-height:100vh;display:grid;place-items:center;color:#7e1748">Đang tải MedQuiz Pink…</div>
<script>window.__MEDQUIZ_BUNDLE__=[];</script>
<script src="bundle-1.js?v=12"></script>
<script src="bundle-2.js?v=12"></script>
<script src="bundle-3.js?v=12"></script>
<script src="bundle-4.js?v=12"></script>
<script src="bundle-5a.js?v=12"></script>
<script src="bundle-5b.js?v=12"></script>
<script src="bundle-6a.js?v=12"></script>
<script src="bundle-6b.js?v=12"></script>
<script>
(async()=>{
  async function gunzipText(bytes){
    if(!('DecompressionStream' in window)) throw new Error('Trình duyệt chưa hỗ trợ giải nén dữ liệu của ứng dụng.');
    const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
    const chunks=[];let total=0;
    while(true){const {value,done}=await reader.read();if(done)break;if(value){chunks.push(value);total+=value.length;}}
    const out=new Uint8Array(total);let offset=0;
    for(const chunk of chunks){out.set(chunk,offset);offset+=chunk.length;}
    return new TextDecoder('utf-8').decode(out);
  }

  try{
    const b64=(window.__MEDQUIZ_BUNDLE__||[]).join('');
    if(!b64||b64.length<1000) throw new Error('Không tải đủ file ứng dụng. Hãy refresh trang.');
    const raw=atob(b64);const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    let html=await gunzipText(bytes);

    const patchCss=`
.review-edit-card{padding:16px;border:1px solid #efcfdd;border-radius:18px;background:#fff9fc;margin-bottom:12px;box-shadow:0 5px 16px rgba(132,33,83,.06)}
.review-edit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.review-edit-options{display:grid;gap:8px;margin-top:10px}
.review-edit-option{display:grid;grid-template-columns:34px minmax(0,1fr) 36px;gap:8px;align-items:center}
.review-edit-option input[type=radio]{width:auto}
.review-edit-option .remove-option{padding:6px 9px}
.review-edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.review-source-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
`;
    html=html.replace('</style>',patchCss+'\n</style>');

    const patchScript=`<script>
(function(){
  if(typeof collectTopicMarkers!=='function'){
    window.collectTopicMarkers=function(text){
      const markers=[];
      const major=/(^|---\\s*)([IVX]{1,6})\\.\\s*([A-ZÀ-Ỹ][A-ZÀ-Ỹ0-9 \\-–/&]{2,45}?)(?=\\s+(?:---|\\*\\*|Chào|Dựa|Câu|\\d{1,4}\\.))/g;
      let m;
      while((m=major.exec(text))){const name=cleanMd(m[3]).replace(/\\s+$/,'');if(name&&!/^NXB\\b/i.test(name))markers.push({pos:m.index,type:'major',name});}
      const sub=/\\*\\*(Phần\\s+\\d+\\s*:[^*]{2,120})\\*\\*/gi;
      while((m=sub.exec(text)))markers.push({pos:m.index,type:'sub',name:cleanMd(m[1])});
      markers.sort((a,b)=>a.pos-b.pos);return markers;
    };
    window.topicAt=function(markers,pos){let major='Chưa phân loại',sub='';for(const mk of markers){if(mk.pos>pos)break;if(mk.type==='major'){major=mk.name;sub='';}else if(mk.type==='sub')sub=mk.name;}return sub?major+' / '+sub:major;};
  }

  // PDF/TXT parser V12: ưu tiên giữ dữ liệu để user sửa, không vứt câu chỉ vì parser tách chưa đẹp.
  window.parseQuestionText=function(raw,fileName=''){
    const text=normalizeSourceText(raw);
    const topicMarkers=collectTopicMarkers(text);
    const pageMarkers=collectPageMarkers(text);
    const re=/(^|\\s)(?:Câu\\s*)?(\\d{1,4})\\s*(?:[.:]|\\/)\\s*(?=[(*A-ZÀ-Ỹ“"])/g;
    const starts=[];let m;
    while((m=re.exec(text)))starts.push({markerStart:m.index+(m[1]?m[1].length:0),bodyStart:re.lastIndex,no:m[2]});

    const valid=[],review=[],invalid=[];
    const existing=new Set(questions.map(fingerprint));let duplicate=0;

    for(let i=0;i<starts.length;i++){
      const st=starts[i],end=i+1<starts.length?starts[i+1].markerStart:text.length;
      let body=stripPageMarkers(text.slice(st.bodyStart,end)).trim();
      if(!body)continue;
      const page=sourcePageAt(pageMarkers,st.markerStart);
      const ansRe=/\\*{0,2}\\s*(?:Đáp\\s*án(?:\\s*đúng)?|Đ\\/?A|Answer|Correct\\s*answer)\\s*:?\\s*\\*{0,2}\\s*([A-F])[\\.\\)]?/i;
      const explicit=ansRe.exec(body);
      const optionZone=explicit?body.slice(0,explicit.index):body;
      const optRe=/(^|\\s)(?:\\*{1,2})?([A-F])[\\.\\)](?:\\*{1,2})?\\s*/g;
      const om=[];let x;
      while((x=optRe.exec(optionZone)))om.push({start:x.index+(x[1]?x[1].length:0),contentStart:optRe.lastIndex,letter:x[2].toUpperCase(),markerBold:/\\*\\*/.test(x[0])});

      if(om.length<2){
        review.push({
          id:uid(),text:cleanMd(body),stem:cleanMd(body),opts:[],correct:null,correctDraft:null,
          topic:topicAt(topicMarkers,st.markerStart),source:'raw-import',
          sourceMeta:{file:fileName||null,page:page||null,question_no:Number(st.no)||st.no||null},
          sourceOrder:Number(st.no)||null,importFileName:fileName||null,createdAt:new Date().toISOString(),
          answerStatus:'needs_manual_repair',
          detection:detection('needs_review','parser_could_not_split',0,'Parser không tách được options. User cần sửa stem/options thủ công.',['BROKEN_OPTIONS'])
        });
        continue;
      }

      const qtext=cleanMd(optionZone.slice(0,om[0].start));
      const rawOpts=[];
      for(let j=0;j<om.length;j++){
        const oe=j+1<om.length?om[j+1].start:optionZone.length;
        rawOpts.push({letter:om[j].letter,raw:optionZone.slice(om[j].contentStart,oe).trim(),markerBold:!!om[j].markerBold});
      }
      const opts=rawOpts.map(o=>cleanMd(o.raw));
      const base=rawQuestionBase({st,no:st.no,qtext:qtext||cleanMd(body),opts,topic:topicAt(topicMarkers,st.markerStart),page,fileName});

      if(!qtext||opts.some(o=>!o)){
        review.push({...base,correct:null,correctDraft:null,answerStatus:'needs_manual_repair',detection:detection('needs_review','parser_partial_structure',0.15,'Parser nhận diện câu nhưng stem/options chưa sạch. User cần sửa thủ công.',['BROKEN_STRUCTURE'])});
        continue;
      }

      let correctLetter=null,det=null;
      if(explicit){
        correctLetter=explicit[1].toUpperCase();
        det=detection('ready','explicit_answer_key',0.99,explicit[0],[]);
      }else{
        const boldMarked=rawOpts.filter(o=>o.markerBold||/^\\*\\*/.test(o.raw)||/\\*\\*$/.test(o.raw));
        const checkMarked=rawOpts.filter(o=>/^(?:✓|✔|✅|☑)\\s*/.test(o.raw));
        if(boldMarked.length===1){correctLetter=boldMarked[0].letter;det=detection('ready','bold_option',0.94,'Một lựa chọn được đánh dấu bold.',[]);}
        else if(checkMarked.length===1){correctLetter=checkMarked[0].letter;det=detection('ready','marked_option',0.96,'Một lựa chọn có marker đúng/check.',[]);}
        else if(boldMarked.length>1||checkMarked.length>1){det=detection('needs_review','conflicting_markers',0.35,'Có nhiều lựa chọn cùng mang marker đáp án.',['MULTIPLE_ANSWER_SIGNALS']);}
        else det=detection('needs_review','no_source_answer',0.10,'Không tìm thấy answer key đủ chắc chắn.',['NO_SOURCE_ANSWER']);
      }

      const correct=rawOpts.findIndex(o=>o.letter===correctLetter);
      const fp=fingerprint(base);
      if(existing.has(fp)){duplicate++;continue;}existing.add(fp);
      if(correct>=0&&det?.status==='ready')valid.push({...base,correct,detection:det,review:{status:'source_verified',answer_basis:det.basis,confidence:'high'}});
      else review.push({...base,correct:null,correctDraft:correct>=0?correct:null,detection:det||detection('needs_review','unknown',0.10,'',['NO_SOURCE_ANSWER']),answerStatus:'needs_review'});
    }
    return {valid,review,invalid,detected:starts.length,duplicate,expected:null,datasetId:null,datasetTitle:null,fileName:fileName||null,mode:'merge',schemaVersion:null};
  };

  function normalizedReviewText(q){return cleanMd(q.text||q.stem||q.sample||'');}
  function normalizedReviewOpts(q){if(Array.isArray(q.opts))return q.opts.map(x=>cleanMd(x));if(Array.isArray(q.options))return q.options.map(x=>cleanMd(x&&typeof x==='object'?x.text:x));return [];}
  function saveReviewDraft(index,card){
    const q=reviewQueue[index];if(!q||!card)return false;
    q.text=cleanMd(card.querySelector('[data-rq-stem]')?.value||q.text||q.stem||q.sample||'');q.stem=q.text;
    q.topic=cleanMd(card.querySelector('[data-rq-topic]')?.value||q.topic||'Chưa phân loại')||'Chưa phân loại';
    q.opts=[...card.querySelectorAll('[data-rq-option]')].map(el=>cleanMd(el.value));
    const selected=card.querySelector('[data-rq-answer]:checked');q.correctDraft=selected?Number(selected.value):null;
    q.answerStatus='needs_review';q.updatedAt=new Date().toISOString();persist();return true;
  }
  function promoteReview(index,card){
    const q=reviewQueue[index];if(!q)return;saveReviewDraft(index,card);
    const text=normalizedReviewText(q),opts=normalizedReviewOpts(q),correct=Number(q.correctDraft);
    if(!text){alert('Stem đang trống.');return;}
    if(opts.length<2||opts.length>6||opts.some(x=>!x)){alert('Cần từ 2 đến 6 lựa chọn và không được để option trống.');return;}
    if(!Number.isInteger(correct)||correct<0||correct>=opts.length){alert('Hãy chọn đáp án đúng trước khi lưu vào Question Bank.');return;}
    const item={...q,id:q.id||uid(),text,stem:text,opts,correct,answerStatus:'user_verified',review:{status:'user_verified',answer_basis:'user_review',confidence:'high',reviewed_at:new Date().toISOString()},detection:{...(q.detection||{}),status:'ready',basis:'user_review',confidence:1,evidence:'User xác nhận trong Review Queue.'}};delete item.correctDraft;
    const fp=fingerprint(item);
    if(questions.some(existing=>fingerprint(existing)===fp)){alert('Câu này đã tồn tại trong Question Bank. Review item sẽ được bỏ khỏi queue để tránh trùng.');reviewQueue.splice(index,1);persist();refreshAll();return;}
    questions.push(item);
    if(item.topic&&!topicRegistry.some(t=>t.name===item.topic))topicRegistry.push({id:slugTopicId(item.topic),name:item.topic,createdAt:new Date().toISOString(),source:'review'});
    reviewQueue.splice(index,1);persist();refreshAll();renderReviewTab();
  }

  window.renderReviewTab=function(){
    const count=document.getElementById('reviewTabCount'),host=document.getElementById('reviewTabList');
    if(count)count.textContent=reviewQueue.length+' câu';if(!host)return;
    if(!reviewQueue.length){host.innerHTML='<div class="empty">Review Queue đang trống.</div>';return;}
    host.innerHTML=reviewQueue.map((q,i)=>{
      const text=normalizedReviewText(q),opts=normalizedReviewOpts(q);
      const draft=Number.isInteger(q.correctDraft)?q.correctDraft:(Number.isInteger(q.correct)?q.correct:null);
      const page=q.sourceMeta?.page||q.source?.page||null,qno=q.sourceMeta?.question_no||q.source?.question_no||q.sourceOrder||null;
      return '<div class="review-edit-card" data-rq-card="'+i+'">'+
        '<div class="review-edit-head"><div class="review-source-line"><span class="badge warn">Needs Review</span>'+(page?'<span class="badge">Trang '+escapeHtml(page)+'</span>':'')+(qno?'<span class="badge">Câu '+escapeHtml(qno)+'</span>':'')+'<span class="badge">'+escapeHtml(q.topic||'Chưa phân loại')+'</span></div><button class="danger" data-rq-delete="'+i+'">Bỏ câu</button></div>'+
        '<div class="field"><label>Stem</label><textarea data-rq-stem>'+escapeHtml(text)+'</textarea></div>'+
        '<div class="review-edit-options">'+opts.map((opt,oi)=>'<div class="review-edit-option"><input type="radio" name="rq-answer-'+i+'" value="'+oi+'" data-rq-answer '+(draft===oi?'checked':'')+'><input type="text" data-rq-option value="'+escapeHtml(opt)+'"><button class="danger remove-option" data-rq-remove-option="'+oi+'">×</button></div>').join('')+'</div>'+
        '<div class="review-edit-actions"><button data-rq-add-option="'+i+'">+ Thêm lựa chọn</button></div>'+
        '<div class="field" style="margin-top:10px"><label>Topic</label><input data-rq-topic value="'+escapeHtml(q.topic||'Chưa phân loại')+'"></div>'+
        '<div class="small" style="margin-top:8px">'+escapeHtml(q.detection?.evidence||q.answerStatus||'Câu chưa có đáp án đủ chắc chắn.')+'</div>'+
        '<div class="review-edit-actions"><button data-rq-save="'+i+'">Lưu nháp</button><button class="success" data-rq-promote="'+i+'">Xác nhận → Question Bank</button></div></div>';
    }).join('');

    host.querySelectorAll('[data-rq-save]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.rqSave),card=host.querySelector('[data-rq-card="'+i+'"]');saveReviewDraft(i,card);alert('Đã lưu chỉnh sửa trong Review Queue.');});
    host.querySelectorAll('[data-rq-promote]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.rqPromote),card=host.querySelector('[data-rq-card="'+i+'"]');promoteReview(i,card);});
    host.querySelectorAll('[data-rq-delete]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.rqDelete);if(confirm('Bỏ câu này khỏi Review Queue?')){reviewQueue.splice(i,1);persist();refreshAll();renderReviewTab();}});
    host.querySelectorAll('[data-rq-add-option]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.rqAddOption),card=host.querySelector('[data-rq-card="'+i+'"]');saveReviewDraft(i,card);reviewQueue[i].opts=normalizedReviewOpts(reviewQueue[i]);if(reviewQueue[i].opts.length>=6){alert('Tối đa 6 lựa chọn.');return;}reviewQueue[i].opts.push('');reviewQueue[i].correctDraft=null;persist();renderReviewTab();});
    host.querySelectorAll('[data-rq-remove-option]').forEach(btn=>btn.onclick=()=>{const card=btn.closest('[data-rq-card]'),i=Number(card.dataset.rqCard),oi=Number(btn.dataset.rqRemoveOption);saveReviewDraft(i,card);reviewQueue[i].opts.splice(oi,1);reviewQueue[i].correctDraft=null;persist();renderReviewTab();});
  };

  if(typeof renderImportPreview==='function'){
    const originalRenderImportPreview=renderImportPreview;
    window.renderImportPreview=function(){
      originalRenderImportPreview();const b=importBuffer||{valid:[],review:[],invalid:[]};
      const commit=document.getElementById('commitImportBtn');if(commit)commit.disabled=!((b.valid||[]).length||(b.review||[]).length||(b.invalid||[]).length);
      const warn=document.getElementById('importWarning');if(warn&&warn.innerHTML)warn.innerHTML=warn.innerHTML.replace(/Commit đang bị khóa[^<.]*/g,'Các câu này sẽ được lưu vào Review Queue để user tự sửa sau');
      const badge=document.getElementById('importStageBadge');if(badge&&(b.review||[]).length)badge.textContent=(b.valid||[]).length+' Ready · '+b.review.length+' Review';
    };
  }

  const commitBtn=document.getElementById('commitImportBtn');
  if(commitBtn)commitBtn.onclick=function(){
    const ready=[...(importBuffer.valid||[])],unresolved=[...(importBuffer.review||[])];
    if(!ready.length&&!unresolved.length&&!(importBuffer.invalid||[]).length)return;
    let removed=0;
    if(importBuffer.mode==='replace'&&importBuffer.datasetId){const old=questions.filter(q=>q.datasetId===importBuffer.datasetId);removed=old.length;const oldIds=new Set(old.map(q=>q.id));questions=questions.filter(q=>q.datasetId!==importBuffer.datasetId);oldIds.forEach(id=>delete progress[id]);reviewQueue=reviewQueue.filter(q=>q.datasetId!==importBuffer.datasetId);if(session&&session.queue?.some(id=>oldIds.has(id)))session=null;}
    questions.push(...ready);
    unresolved.forEach(q=>reviewQueue.push({...q,correct:null,answerStatus:q.answerStatus||'needs_review',queuedAt:new Date().toISOString(),review:{status:'needs_review',answer_basis:'user_review_required',confidence:'unresolved'}}));
    (importBuffer.invalid||[]).forEach((b,i)=>reviewQueue.push({id:uid(),text:cleanMd(b.sample||b.detail||''),stem:cleanMd(b.sample||b.detail||''),opts:[],correct:null,correctDraft:null,topic:'Chưa phân loại',datasetId:importBuffer.datasetId||null,datasetTitle:importBuffer.datasetTitle||null,importFileName:importBuffer.fileName||null,source:'broken-import',sourceMeta:{file:importBuffer.fileName||null,page:b.page||null,question_no:b.no||null},answerStatus:'needs_manual_repair',queuedAt:new Date().toISOString(),detection:detection('needs_review','broken_import',0,b.detail||'Parser không tách được câu. User cần sửa thủ công.',[b.reason||'BROKEN_STRUCTURE'])}));
    [...ready,...unresolved].forEach(q=>{const name=cleanMd(q.topic||'');if(name&&!topicRegistry.some(t=>t.name===name))topicRegistry.push({id:slugTopicId(name),name,createdAt:new Date().toISOString(),source:q.correct==null?'review':'import'});});
    const imported=ready.length,queued=unresolved.length+(importBuffer.invalid||[]).length,duplicates=importBuffer.duplicate||0;
    importBuffer=blankImportBuffer();importReviewPage=1;persist();renderImportPreview();refreshAll();renderQuestion();
    alert('Import hoàn tất: '+imported+' câu vào Question Bank · '+queued+' câu vào Review Queue · '+duplicates+' Trùng.'+(removed?' Đã thay thế '+removed+' câu cũ.':''));
  };

  if(typeof renderReviewQueueSummary==='function'){
    const oldSummary=renderReviewQueueSummary;
    window.renderReviewQueueSummary=function(){oldSummary();const el=document.getElementById('reviewQueueSummary');if(el&&reviewQueue.length)el.innerHTML+='<br><span class="small">Mở tab Review Queue để sửa stem/options/topic, thêm hoặc xóa lựa chọn, chọn đáp án và đưa câu vào Question Bank.</span>';};
  }

  try{renderImportPreview();renderReviewQueueSummary();renderReviewTab();}catch(e){console.warn('V12 review patch init',e);}
})();
<\/script>`;
    html=html.replace('</body>',patchScript+'\n</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.getElementById('loading').innerHTML='<div style="max-width:720px;padding:32px;text-align:center"><h2>Không thể tải MedQuiz Pink</h2><p>'+String(err.message||err)+'</p><p>Hãy refresh cứng trang. Nếu vẫn lỗi, báo lại để kiểm tra bundle deploy.</p></div>';
  }
})();
</script>
</body>
</html>
